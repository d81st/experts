[project]
name = "xau-backtester"
version = "0.1.0"
description = "Независимый тиковый бэктестер XAUUSD. Не использует тестер MT5."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=14,<18"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
