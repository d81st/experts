name: Backtest MQL5

on:
  push:
    paths:
      - 'tester/*.json'
      - '.github/workflows/backtest.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Имена файлов настроек без .json через запятую (пусто — все)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  backtest:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install MetaTrader 5 (Exness build)
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe"
          $setup = "$env:RUNNER_TEMP\exness5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $setup -ErrorAction Stop
          $sig = Get-AuthenticodeSignature $setup
          Write-Host "Installer signature: $($sig.Status) | $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Installer signature is not valid, refusing to run it" }
          $used = $url
          Write-Host "Installer: $used"
          $p = Start-Process -FilePath $setup -ArgumentList "/auto" -PassThru
          if (-not $p.WaitForExit(15 * 60 * 1000)) { Write-Host "Installer still running after 15 min, killing it" }
          Get-Process terminal64, *setup* -ErrorAction SilentlyContinue | Stop-Process -Force
          $term = Get-ChildItem "C:\Program Files" -Recurse -Depth 2 -Filter terminal64.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $term) { throw "terminal64.exe not found" }
          Write-Host "Terminal folder: $($term.DirectoryName)"
          "MT5_ROOT=$($term.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem "$($term.DirectoryName)\config" -ErrorAction SilentlyContinue | Format-Table Name, Length

      - name: Compile experts into terminal folder
        shell: pwsh
        run: |
          $dst = "$env:MT5_ROOT\MQL5\Experts\experts"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\*.mq5" $dst
          Copy-Item "$env:GITHUB_WORKSPACE\Include" $dst -Recurse -Force
          foreach ($f in Get-ChildItem $dst -Filter *.mq5) {
            $log = "$env:RUNNER_TEMP\$($f.BaseName).compile.log"
            Start-Process -FilePath "$env:MT5_ROOT\metaeditor64.exe" -ArgumentList "/compile:`"$($f.FullName)`"", "/log:`"$log`"", "/inc:`"$env:MT5_ROOT\MQL5`"" -Wait
            $text = Get-Content $log -Encoding Unicode -Raw
            Write-Host "$($f.Name): $(($text -split "`n" | Select-String 'Result:') -join ' ')"
          }
          Get-ChildItem $dst -Filter *.ex5 | Format-Table Name, Length

      - name: First login (terminal update and symbol sync)
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          if (-not $env:MT5_LOGIN -or -not $env:MT5_PASSWORD -or -not $env:MT5_SERVER) { throw "MT5_LOGIN / MT5_PASSWORD / MT5_SERVER secrets are not set" }
          $ini = "$env:RUNNER_TEMP\login.ini"
          @("[Common]", "Login=$env:MT5_LOGIN", "Password=$env:MT5_PASSWORD", "Server=$env:MT5_SERVER",
            "ProxyEnable=0", "NewsEnable=0") | Out-File $ini -Encoding Unicode
          $t = Start-Process -FilePath "$env:MT5_ROOT\terminal64.exe" -ArgumentList "/portable", "/config:`"$ini`"" -PassThru
          Start-Sleep -Seconds 150
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item $ini -Force
          Start-Sleep -Seconds 5
          $journal = Get-ChildItem "$env:MT5_ROOT\logs" -Filter *.log -ErrorAction SilentlyContinue |
            ForEach-Object { Get-Content $_.FullName -Encoding Unicode }
          Write-Host "--- terminal journal: network ---"
          $journal | Where-Object { $_ -match 'Network|authoriz|account|server' } | Select-Object -Last 40 | ForEach-Object { Write-Host $_ }
          if (-not ($journal | Where-Object { $_ -match 'authorized on' })) {
            throw "Could not log in to the trade server (no 'authorized on' line in the journal)"
          }

      - name: Run Strategy Tester
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          $reports = "$env:MT5_ROOT\reports"
          New-Item -ItemType Directory -Force $reports | Out-Null
          $configs = Get-ChildItem "$env:GITHUB_WORKSPACE\tester" -Filter *.json
          if ($env:ONLY) {
            $names = $env:ONLY -split ',' | ForEach-Object { $_.Trim() }
            $configs = $configs | Where-Object { $names -contains $_.BaseName }
          }
          $failed = @()
          foreach ($cfgFile in $configs) {
            $cfg = Get-Content $cfgFile.FullName -Raw | ConvertFrom-Json
            # Варианты параметров бота: "variants": [{"name": "be-off", "inputs": {"TrailingMode": 0}}].
            # Без "variants" — один прогон с параметрами по умолчанию (или общими "inputs").
            $variants = @($cfg.variants)
            if (-not $cfg.variants) { $variants = @([pscustomobject]@{ name = ""; inputs = $cfg.inputs }) }
            foreach ($var in $variants) {
            # Параметры варианта = общие "inputs" конфига, поверх — "inputs" варианта.
            $merged = [ordered]@{}
            foreach ($src in @($cfg.inputs, $var.inputs)) {
              if ($src) { foreach ($prop in $src.PSObject.Properties) { $merged[$prop.Name] = $prop.Value } }
            }
            $inputLines = @()
            foreach ($k in $merged.Keys) {
              $v = "$($merged[$k])"
              if ($merged[$k] -is [bool]) { $v = $v.ToLower() }
              $inputLines += "$k=$v||$v||0||$v||N"
            }
            # Тестер запоминает параметры прошлого прогона — стираем, чтобы не наследовать.
            Get-ChildItem "$env:MT5_ROOT\MQL5\Profiles\Tester", "$env:MT5_ROOT\Tester" -Filter *.set -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "removing saved tester inputs: $($_.FullName)"; Remove-Item $_.FullName -Force }
            $suffix = ""
            if ($var.name) { $suffix = "_$($var.name)" }
            $done = $false
            foreach ($sym in $cfg.symbols) {
              # Имя файла настроек в имени отчёта: прогоны разных конфигов не перезаписывают друг друга.
              $name = "$($cfgFile.BaseName)_$($sym)_$($cfg.period)$suffix"
              $ini = "$env:RUNNER_TEMP\tester.ini"
              @("[Common]", "Login=$env:MT5_LOGIN", "Password=$env:MT5_PASSWORD", "Server=$env:MT5_SERVER",
                "ProxyEnable=0", "NewsEnable=0",
                "[Tester]",
                "Expert=experts\$($cfg.expert).ex5",
                "Symbol=$sym",
                "Period=$($cfg.period)",
                "Model=$($cfg.model)",
                "ExecutionMode=$($cfg.delay)",
                "Optimization=0",
                "FromDate=$($cfg.from)",
                "ToDate=$($cfg.to)",
                "ForwardMode=0",
                "Deposit=$($cfg.deposit)",
                "Currency=$($cfg.currency)",
                "Leverage=1:$($cfg.leverage)",
                "Visual=0",
                "Report=reports\$name",
                "ReplaceReport=1",
                "ShutdownTerminal=1") | Out-File $ini -Encoding Unicode
              if ($inputLines) { (@("[TesterInputs]") + $inputLines) | Out-File $ini -Encoding Unicode -Append }
              Write-Host "=== $($cfgFile.Name)${suffix}: $($cfg.expert) on $sym $($cfg.period) $($cfg.from)-$($cfg.to), model $($cfg.model), delay $($cfg.delay) | inputs: $($inputLines -join '; ') ==="
              $t = Start-Process -FilePath "$env:MT5_ROOT\terminal64.exe" -ArgumentList "/portable", "/config:`"$ini`"" -PassThru
              if (-not $t.WaitForExit(60 * 60 * 1000)) {
                Write-Host "Tester did not finish in time, killing terminal"
                Get-Process terminal64, metatester64 -ErrorAction SilentlyContinue | Stop-Process -Force
              }
              Remove-Item $ini -Force
              $rep = Get-ChildItem $reports -Filter "$name.htm" -ErrorAction SilentlyContinue
              if ($rep) { Write-Host "Report created: $($rep.Name -join ', ')"; $done = $true; break }
              Write-Host "No report for $sym, trying next symbol"
            }
            if (-not $done) { $failed += "$($cfgFile.Name)$suffix" }
            }
          }
          Write-Host "--- tester journal (tail) ---"
          Get-ChildItem "$env:MT5_ROOT\Tester\logs" -Filter *.log -ErrorAction SilentlyContinue |
            ForEach-Object { Get-Content $_.FullName -Encoding Unicode | Select-Object -Last 40 }
          if ($failed) { throw "No report for: $($failed -join ', ')" }

      - name: Collect results
        if: always()
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\results\run-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force "$out\logs" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\tester\*.json" $out
          Copy-Item "$env:MT5_ROOT\reports\*" $out -ErrorAction SilentlyContinue
          Copy-Item "$env:MT5_ROOT\logs\*.log" "$out\logs" -ErrorAction SilentlyContinue
          Get-ChildItem "$env:MT5_ROOT\Tester" -Recurse -Filter *.log -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName ("$out\logs\tester_" + $_.Directory.Parent.Name + "_" + $_.Name) }
          # Журналы сжимаем: за длинный период они весят сотни МБ (лимит GitHub — 100 МБ на файл).
          Get-ChildItem "$out\logs" -File | ForEach-Object {
            $zip = "$($_.FullName).zip"
            Compress-Archive -Path $_.FullName -DestinationPath $zip -CompressionLevel Optimal
            Remove-Item $_.FullName
            if ((Get-Item $zip).Length -gt 90MB) {
              Remove-Item $zip
              "Журнал $($_.Name) не сохранён: даже сжатый больше 90 МБ" | Out-File "$($_.FullName).skipped.txt" -Encoding utf8
            }
          }
          Get-ChildItem $out -Recurse | Format-Table FullName, Length

      - name: Publish results to tester-results branch
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "$env:RUNNER_TEMP\results-repo"
          $url = "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          git clone --depth 1 --branch tester-results $url $repo 2>$null
          if ($LASTEXITCODE -ne 0) {
            git init $repo
            git -C $repo checkout -b tester-results
            git -C $repo remote add origin $url
          }
          Copy-Item "$env:RUNNER_TEMP\results\*" $repo -Recurse -Force
          git -C $repo config user.name "github-actions"
          git -C $repo config user.email "github-actions@users.noreply.github.com"
          git -C $repo add -A
          git -C $repo commit -m "Backtest results for run $env:GITHUB_RUN_ID ($env:GITHUB_SHA)"
          git -C $repo push origin tester-results
