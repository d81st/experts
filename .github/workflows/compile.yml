name: Compile MQL5

on:
  push:
    paths:
      - '**.mq5'
      - '**.mqh'
      - '.github/workflows/compile.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\mt5setup.exe"
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile $setup
          $p = Start-Process -FilePath $setup -ArgumentList "/auto" -PassThru
          if (-not $p.WaitForExit(15 * 60 * 1000)) { Write-Host "Installer still running after 15 min, killing it" }
          Get-Process mt5setup, terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          $root = "C:\Program Files\MetaTrader 5"
          if (-not (Test-Path "$root\metaeditor64.exe")) { throw "metaeditor64.exe not found in $root" }
          Get-ChildItem $root | Format-Table Name, Length

      - name: Locate standard MQL5 library
        shell: pwsh
        run: |
          $root = "C:\Program Files\MetaTrader 5"
          function Find-Mql5 {
            Get-ChildItem $root, "$env:APPDATA\MetaQuotes" -Recurse -Filter Trade.mqh -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\MQL5\\Include\\Trade\\Trade\.mqh$' } |
              Select-Object -First 1
          }
          $trade = Find-Mql5
          if (-not $trade) {
            Write-Host "Standard library not found, starting terminal once in portable mode to unpack it"
            $t = Start-Process -FilePath "$root\terminal64.exe" -ArgumentList "/portable" -PassThru
            Start-Sleep -Seconds 90
            Stop-Process -Id $t.Id -Force -ErrorAction SilentlyContinue
            $trade = Find-Mql5
          }
          if (-not $trade) { throw "Trade.mqh not found" }
          $mql5 = $trade.Directory.Parent.Parent.FullName
          Write-Host "MQL5 folder: $mql5"
          "MQL5_DIR=$mql5" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile experts
        shell: pwsh
        run: |
          $me = "C:\Program Files\MetaTrader 5\metaeditor64.exe"
          $logs = "$env:GITHUB_WORKSPACE\compile-logs"
          New-Item -ItemType Directory -Force $logs | Out-Null
          $failed = 0
          $summary = @("| Файл | Ошибки | Предупреждения |", "|---|---|---|")
          # Боты в корне и в папках hybrid/ (рабочие) и archive/ (старые).
          $files = @(Get-ChildItem $env:GITHUB_WORKSPACE -Filter *.mq5)
          foreach ($d in @("hybrid", "archive")) { $files += @(Get-ChildItem "$env:GITHUB_WORKSPACE\$d" -Filter *.mq5 -ErrorAction SilentlyContinue) }
          foreach ($f in $files) {
            $log = Join-Path $logs ($f.BaseName + ".log")
            Start-Process -FilePath $me -ArgumentList "/compile:`"$($f.FullName)`"", "/log:`"$log`"", "/inc:`"$env:MQL5_DIR`"" -Wait
            if (-not (Test-Path $log)) {
              Write-Host "::error file=$($f.Name)::Compiler produced no log"
              $failed++; $summary += "| $($f.Name) | нет лога | |"; continue
            }
            $text = Get-Content $log -Encoding Unicode -Raw
            Write-Host "===== $($f.Name) ====="
            Write-Host $text
            $err = 0; $warn = 0
            if ($text -match '(\d+)\s+errors?') { $err = [int]$Matches[1] }
            if ($text -match '(\d+)\s+warnings?') { $warn = [int]$Matches[1] }
            $ex5 = [IO.Path]::ChangeExtension($f.FullName, ".ex5")
            if ($err -gt 0 -or -not (Test-Path $ex5)) { $failed++; Write-Host "::error file=$($f.Name)::$err error(s)" }
            if ($warn -gt 0) { Write-Host "::warning file=$($f.Name)::$warn warning(s)" }
            $summary += "| $($f.Name) | $err | $warn |"
          }
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Copy-Item "$env:GITHUB_WORKSPACE\*.ex5" $logs -ErrorAction SilentlyContinue
          if ($failed -gt 0) { throw "$failed file(s) failed to compile" }

      - name: Upload logs and binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-results
          path: compile-logs/
