name: Demo forward probe

# Пуш в grok запускает это только если изменился data/demo-forward-probe-request.json
# и в нём "run": true. Скрипт не торгует и не вешает советник. В лог и артефакт
# попадают только режим счёта, валюта, флаг «около 10k» и кнопка автоторговли.
on:
  push:
    branches: [grok]
    paths:
      - 'data/demo-forward-probe-request.json'

permissions:
  contents: read

concurrency:
  group: demo-forward-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/grok'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.resolve.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the probe checker
        run: python3 tools/demo_forward_probe.py --self-test

      - name: Resolve probe request
        id: resolve
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          data = json.loads(Path("data/demo-forward-probe-request.json").read_text(encoding="utf-8"))
          if set(data) != {"run", "note"}:
              raise SystemExit("request has an unexpected field")
          if not isinstance(data["note"], str) or not re.fullmatch(r"[A-Za-z0-9 ._-]{0,80}", data["note"]):
              raise SystemExit("request note is invalid")
          if data["run"] not in (True, False):
              raise SystemExit("run must be a boolean")
          armed = data["run"] is True
          path = os.environ.get("GITHUB_OUTPUT")
          if path:
              with open(path, "a", encoding="utf-8") as handle:
                  handle.write("run=" + ("true" if armed else "false") + "\n")
          print("run" if armed else "run skipped")
          PY

  probe:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Read the runner without installing a terminal
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $boot = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime
          $uptime = [int]((Get-Date) - $boot).TotalMinutes
          $services = @(Get-Service -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'actions.runner.*' })
          $terminals = @()
          Get-ChildItem "C:\Program Files", "C:\Program Files (x86)" -Recurse -Depth 3 -Filter terminal64.exe -ErrorAction SilentlyContinue |
            ForEach-Object {
              $name = $_.Directory.Name
              if ($name -match '^[A-Za-z0-9 .()_-]{1,60}$') { $terminals += $name }
            }
          $procs = @(Get-Process terminal64, metatester64 -ErrorAction SilentlyContinue)
          $imageOs = ""
          $imageVersion = ""
          if ($env:ImageOS -match '^[A-Za-z0-9._-]{1,40}$') { $imageOs = $env:ImageOS }
          if ($env:ImageVersion -match '^[A-Za-z0-9._-]{1,40}$') { $imageVersion = $env:ImageVersion }
          $kind = "ephemeral-job-vm"
          if ($imageOs) { $kind = "github-hosted-vm" }
          if ($services.Count -gt 0) { $kind = "windows-service-runner" }
          $facts = [ordered]@{
            runner_kind = $kind
            image_os = $imageOs
            image_version = $imageVersion
            uptime_minutes = $uptime
            runner_service_count = $services.Count
            runner_service_running = @($services | Where-Object Status -eq 'Running').Count
            runner_service_automatic = @($services | Where-Object StartType -eq 'Automatic').Count
            terminals_before_install = @($terminals | Select-Object -Unique)
            terminal_processes_before_install = $procs.Count
            startup_section = $false
            startup_key_names = @()
            experts_enabled = $null
            experts_account = $null
            experts_profile = $null
            experts_chart = $null
          }
          $dest = "$env:GITHUB_WORKSPACE\demo-forward-probe-artifact"
          New-Item -ItemType Directory -Force $dest | Out-Null
          $json = ($facts | ConvertTo-Json -Depth 4 -Compress)
          [System.IO.File]::WriteAllText("$dest\host-facts.json", $json + "`n")
          Write-Host "uptime_minutes=$uptime runner_kind=$kind services=$($services.Count) terminals_before=$($facts.terminals_before_install.Count) terminal_processes=$($procs.Count)"

      - name: Install MetaTrader 5 (Exness build)
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe"
          $setup = "$env:RUNNER_TEMP\exness5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $setup -ErrorAction Stop
          $sig = Get-AuthenticodeSignature $setup
          Write-Host "Installer signature: $($sig.Status)"
          if ($sig.Status -ne 'Valid') { throw "Installer signature is not valid, refusing to run it" }
          $p = Start-Process -FilePath $setup -ArgumentList "/auto" -PassThru
          if (-not $p.WaitForExit(15 * 60 * 1000)) { Write-Host "Installer still running after 15 min, killing it" }
          Get-Process terminal64, *setup* -ErrorAction SilentlyContinue | Stop-Process -Force
          $term = Get-ChildItem "C:\Program Files" -Recurse -Depth 2 -Filter terminal64.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $term) { throw "terminal64.exe not found" }
          "MT5_ROOT=$($term.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $product = $term.Directory.Name
          if ($product -match '^[A-Za-z0-9 .()_-]{1,60}$') { Write-Host "installed_terminal=$product" }

      - name: First login
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          foreach ($secret in @($env:MT5_LOGIN, $env:MT5_SERVER)) {
            if ($secret -and $secret -match '^[A-Za-z0-9._@\-]+$') { Write-Host "::add-mask::$secret" }
          }
          if (-not $env:MT5_LOGIN -or -not $env:MT5_PASSWORD -or -not $env:MT5_SERVER) { throw "MT5 secrets are not set" }
          $ini = "$env:RUNNER_TEMP\login.ini"
          try {
            @("[Common]", "Login=$env:MT5_LOGIN", "Password=$env:MT5_PASSWORD", "Server=$env:MT5_SERVER",
              "ProxyEnable=0", "NewsEnable=0") | Out-File $ini -Encoding Unicode
            $t = Start-Process -FilePath "$env:MT5_ROOT\terminal64.exe" -ArgumentList "/portable", "/config:`"$ini`"" -PassThru
            if (-not $t.WaitForExit(150000)) { }
          } finally {
            Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
            if (Test-Path $ini) { Remove-Item $ini -Force }
            Start-Sleep -Seconds 5
          }
          $ok = $false
          $logs = Get-ChildItem "$env:MT5_ROOT\logs" -Filter *.log -ErrorAction SilentlyContinue
          foreach ($f in $logs) {
            $bytes = $null
            for ($i = 0; $i -lt 5; $i++) {
              try { $bytes = [System.IO.File]::ReadAllBytes($f.FullName); break } catch { Start-Sleep -Seconds 2 }
            }
            if (-not $bytes -or $bytes.Length -lt 2) { continue }
            if ($bytes[0] -eq 255 -and $bytes[1] -eq 254) { $journal = [System.Text.Encoding]::Unicode.GetString($bytes) }
            else { $journal = [System.Text.Encoding]::UTF8.GetString($bytes) }
            if ($journal -match 'authorized on') { $ok = $true }
            $journal = $null
          }
          if (-not $ok) { throw "Could not log in to the trade server" }
          Write-Host "Trade server accepted the login"

      - name: Read terminal startup flags
        shell: pwsh
        run: |
          $allowKeys = @("Symbol", "Period", "Expert", "ExpertParameters", "Script", "ScriptParameters", "Template", "ShutdownTerminal")
          $startup = $false
          $startupKeys = New-Object System.Collections.Generic.List[string]
          $flags = @{ Enabled = $null; Account = $null; Profile = $null; Chart = $null }
          $inis = @()
          if (Test-Path "$env:MT5_ROOT\config") {
            $inis = @(Get-ChildItem "$env:MT5_ROOT\config" -Filter *.ini -File -ErrorAction SilentlyContinue)
          }
          foreach ($file in $inis) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            if ($bytes.Length -ge 2 -and $bytes[0] -eq 255 -and $bytes[1] -eq 254) {
              $text = [System.Text.Encoding]::Unicode.GetString($bytes)
            } else {
              $text = [System.Text.Encoding]::UTF8.GetString($bytes)
            }
            $section = ""
            foreach ($line in ($text -split "`r?`n")) {
              $trim = $line.Trim()
              if ($trim -match '^\[(.+)\]$') { $section = $Matches[1]; continue }
              if ($trim -notmatch '^([A-Za-z][A-Za-z0-9_]{0,40})=(.*)$') { continue }
              $key = $Matches[1]
              $value = $Matches[2].Trim()
              if ($section -eq "StartUp") {
                $startup = $true
                if ($allowKeys -contains $key -and -not $startupKeys.Contains($key)) { $startupKeys.Add($key) }
              }
              if ($section -eq "Experts" -and $flags.ContainsKey($key) -and $value -match '^[01]$') {
                $flags[$key] = [int]$value
              }
            }
            $text = $null
          }
          $path = "$env:GITHUB_WORKSPACE\demo-forward-probe-artifact\host-facts.json"
          $facts = Get-Content $path -Raw | ConvertFrom-Json
          $facts.startup_section = $startup
          $facts.startup_key_names = @($startupKeys)
          $facts.experts_enabled = $flags.Enabled
          $facts.experts_account = $flags.Account
          $facts.experts_profile = $flags.Profile
          $facts.experts_chart = $flags.Chart
          $json = ($facts | ConvertTo-Json -Depth 4 -Compress)
          [System.IO.File]::WriteAllText($path, $json + "`n")
          Write-Host "startup_section=$startup experts_enabled=$($flags.Enabled) experts_account=$($flags.Account) experts_profile=$($flags.Profile) experts_chart=$($flags.Chart)"

      - name: Compile and run the probe script
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($secret in @($env:MT5_LOGIN, $env:MT5_SERVER)) {
            if ($secret -and $secret -match '^[A-Za-z0-9._@\-]+$') { Write-Host "::add-mask::$secret" }
          }
          $scripts = "$env:MT5_ROOT\MQL5\Scripts"
          New-Item -ItemType Directory -Force $scripts | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\tools\demo-forward-probe.mq5" "$scripts\demo-forward-probe.mq5" -Force
          $log = "$env:RUNNER_TEMP\demo-forward-probe.compile.log"
          Start-Process -FilePath "$env:MT5_ROOT\metaeditor64.exe" -ArgumentList "/compile:`"$scripts\demo-forward-probe.mq5`"", "/log:`"$log`"" -Wait
          if (-not (Test-Path $log)) { throw "compiler produced no log" }
          $bytes = [System.IO.File]::ReadAllBytes($log)
          if ($bytes.Length -ge 2 -and $bytes[0] -eq 255 -and $bytes[1] -eq 254) {
            $compileText = [System.Text.Encoding]::Unicode.GetString($bytes)
          } else {
            $compileText = [System.Text.Encoding]::UTF8.GetString($bytes)
          }
          $result = ($compileText -split "`n" | Where-Object { $_ -match 'Result:|Результат:' } | Select-Object -Last 1)
          Write-Host "probe: $("$result".Trim())"
          if ("$result" -notmatch '(?<!\d)0 errors' -or -not (Test-Path "$scripts\demo-forward-probe.ex5")) {
            throw "probe script failed to compile"
          }
          $common = "$env:APPDATA\MetaQuotes\Terminal\Common\Files"
          New-Item -ItemType Directory -Force $common | Out-Null
          $out = Join-Path $common "demo-forward-probe.json"
          if (Test-Path $out) { Remove-Item $out -Force }
          $ini = "$env:RUNNER_TEMP\probe.ini"
          try {
            @("[Common]", "Login=$env:MT5_LOGIN", "Password=$env:MT5_PASSWORD", "Server=$env:MT5_SERVER",
              "ProxyEnable=0", "NewsEnable=0",
              "[StartUp]",
              "Script=demo-forward-probe",
              "Symbol=XAUUSDm",
              "Period=H1",
              "ShutdownTerminal=1") | Out-File $ini -Encoding Unicode
            $proc = Start-Process -FilePath "$env:MT5_ROOT\terminal64.exe" -ArgumentList "/portable", "/config:`"$ini`"" -PassThru
            $deadline = (Get-Date).AddMinutes(8)
            $stable = $false
            while ((Get-Date) -lt $deadline) {
              if ((Test-Path $out) -and (Get-Item $out).Length -gt 20) { $stable = $true; break }
              if ($proc.HasExited) { Start-Sleep -Seconds 2; break }
              Start-Sleep -Seconds 2
            }
            if (-not $stable -and (Test-Path $out) -and (Get-Item $out).Length -gt 20) { $stable = $true }
            if (-not $stable) { throw "Probe script did not write its JSON" }
          } finally {
            if (Test-Path $ini) { Remove-Item $ini -Force }
            Get-Process terminal64, metatester64 -ErrorAction SilentlyContinue | Stop-Process -Force
          }
          Copy-Item $out "$env:GITHUB_WORKSPACE\demo-forward-probe-artifact\probe.json" -Force

      - name: Check and print the probe
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          foreach ($secret in @($env:MT5_LOGIN, $env:MT5_SERVER)) {
            if ($secret -and $secret -match '^[A-Za-z0-9._@\-]+$') { Write-Host "::add-mask::$secret" }
          }
          $dest = "$env:GITHUB_WORKSPACE\demo-forward-probe-artifact"
          python "$env:GITHUB_WORKSPACE\tools\demo_forward_probe.py" --check-host "$dest\host-facts.json"
          if ($LASTEXITCODE -ne 0) { throw "host facts rejected" }
          python "$env:GITHUB_WORKSPACE\tools\demo_forward_probe.py" --check-probe "$dest\probe.json"
          if ($LASTEXITCODE -ne 0) {
            Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
            throw "probe rejected"
          }

      - name: Upload probe facts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: demo-forward-probe
          path: demo-forward-probe-artifact/
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
