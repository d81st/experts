name: Robot audit

# Честный прогон текущих пресетов на реальных тиках.
# Пуш в grok запускает это только если изменился data/robot-audit-request.json
# и в нём "run": true. Окно зашито: 2026.01.01–2026.10.15. Холдаут с 2026.10.16
# не тестируется. Оптимизация выключена. Журнал терминала, счёт, логин, сервер
# и IP не печатаются и не кладутся в артефакт.
on:
  push:
    branches: [grok]
    paths:
      - 'data/robot-audit-request.json'

permissions:
  contents: read

concurrency:
  group: robot-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/grok'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.resolve.outputs.run }}
      batches: ${{ steps.resolve.outputs.batches }}
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the audit tools
        run: python3 tools/robot_audit.py --self-test

      - name: Resolve robot audit request
        id: resolve
        run: python3 tools/robot_audit.py --resolve-request data/robot-audit-request.json

  audit:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJson(needs.gate.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MetaTrader 5 (Exness build)
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe"
          $setup = "$env:RUNNER_TEMP\exness5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $setup -ErrorAction Stop
          $sig = Get-AuthenticodeSignature $setup
          Write-Host "Installer signature: $($sig.Status) | $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Installer signature is not valid, refusing to run it" }
          $p = Start-Process -FilePath $setup -ArgumentList "/auto" -PassThru
          if (-not $p.WaitForExit(15 * 60 * 1000)) { Write-Host "Installer still running after 15 min, killing it" }
          Get-Process terminal64, *setup* -ErrorAction SilentlyContinue | Stop-Process -Force
          $term = Get-ChildItem "C:\Program Files" -Recurse -Depth 2 -Filter terminal64.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $term) { throw "terminal64.exe not found" }
          "MT5_ROOT=$($term.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: First login (terminal update and symbol sync)
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          foreach ($secret in @($env:MT5_LOGIN, $env:MT5_SERVER)) {
            if ($secret -and $secret -match '^[A-Za-z0-9._@\-]+$') { Write-Host "::add-mask::$secret" }
          }
          if (-not $env:MT5_LOGIN -or -not $env:MT5_PASSWORD -or -not $env:MT5_SERVER) { throw "MT5_LOGIN / MT5_PASSWORD / MT5_SERVER secrets are not set" }
          $ini = "$env:RUNNER_TEMP\login.ini"
          try {
            @("[Common]", "Login=$env:MT5_LOGIN", "Password=$env:MT5_PASSWORD", "Server=$env:MT5_SERVER",
              "ProxyEnable=0", "NewsEnable=0") | Out-File $ini -Encoding Unicode
            $t = Start-Process -FilePath "$env:MT5_ROOT\terminal64.exe" -ArgumentList "/portable", "/config:`"$ini`"" -PassThru
            if (-not $t.WaitForExit(150000)) { }
          } finally {
            Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
            if (Test-Path $ini) { Remove-Item $ini -Force }
            Start-Sleep -Seconds 5
          }
          $ok = $false
          $logs = Get-ChildItem "$env:MT5_ROOT\logs" -Filter *.log -ErrorAction SilentlyContinue
          foreach ($f in $logs) {
            $bytes = $null
            for ($i = 0; $i -lt 5; $i++) {
              try {
                $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
                break
              } catch {
                Start-Sleep -Seconds 2
              }
            }
            if (-not $bytes -or $bytes.Length -lt 2) { continue }
            if ($bytes[0] -eq 255 -and $bytes[1] -eq 254) { $journal = [System.Text.Encoding]::Unicode.GetString($bytes) }
            else { $journal = [System.Text.Encoding]::UTF8.GetString($bytes) }
            if ($journal -match 'authorized on') { $ok = $true }
            $journal = $null
          }
          if (-not $ok) { throw "Could not log in to the trade server" }
          Write-Host "Trade server accepted the login"

      - name: Compile batch experts
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          function Find-Trade {
            Get-ChildItem $env:MT5_ROOT, "$env:APPDATA\MetaQuotes" -Recurse -Filter Trade.mqh -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\Include\\Trade\\Trade\.mqh$' } |
              Select-Object -First 1
          }
          $trade = Find-Trade
          if (-not $trade) {
            Write-Host "Standard library missing, opening the terminal once more"
            $again = Start-Process -FilePath "$env:MT5_ROOT\terminal64.exe" -ArgumentList "/portable" -PassThru
            if (-not $again.WaitForExit(90000)) { }
            Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 3
            $trade = Find-Trade
          }
          if (-not $trade) { throw "Trade.mqh not found after login" }
          $mql5 = $trade.Directory.Parent.Parent.FullName
          Write-Host "MQL5 include root found"
          $raw = python "$env:GITHUB_WORKSPACE\tools\robot_audit.py" --emit-batch "${{ matrix.batch }}"
          if ($LASTEXITCODE -ne 0) { throw "batch plan rejected" }
          $presets = @($raw | ConvertFrom-Json)
          $dst = "$env:MT5_ROOT\MQL5\Experts\experts"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\Include" $dst -Recurse -Force
          foreach ($d in @("hybrid", "archive")) {
            Copy-Item "$env:GITHUB_WORKSPACE\$d" $dst -Recurse -Force
          }
          $bad = New-Object System.Collections.Generic.List[string]
          foreach ($preset in $presets) {
            $rel = ($preset.expert -replace '/', '\')
            $mq5 = Join-Path $dst "$rel.mq5"
            $log = "$env:RUNNER_TEMP\$($preset.id).compile.log"
            Start-Process -FilePath "$env:MT5_ROOT\metaeditor64.exe" -ArgumentList "/compile:`"$mq5`"", "/log:`"$log`"", "/inc:`"$mql5`"" -Wait
            if (-not (Test-Path $log)) { Write-Host "$($preset.id): compiler produced no log"; $bad.Add($preset.id); continue }
            $bytes = [System.IO.File]::ReadAllBytes($log)
            if ($bytes.Length -ge 2 -and $bytes[0] -eq 255 -and $bytes[1] -eq 254) {
              $text = [System.Text.Encoding]::Unicode.GetString($bytes)
            } else {
              $text = [System.Text.Encoding]::UTF8.GetString($bytes)
            }
            $result = ($text -split "`n" | Where-Object { $_ -match 'Result:|Результат:' } | Select-Object -Last 1)
            $resultLine = "$result".Trim()
            Write-Host "$($preset.id): $resultLine"
            $ex5 = Join-Path $dst "$rel.ex5"
            if ($resultLine -notmatch '(?<!\d)0 errors' -or -not (Test-Path $ex5)) {
              $errors = ($text -split "`n" | Where-Object { $_ -match 'error' } | Select-Object -First 20)
              Write-Host ($errors -join "`n")
              $bad.Add($preset.id)
            }
          }
          $bad -join "`n" | Out-File "$env:RUNNER_TEMP\compile-failed.txt" -Encoding ascii
          Write-Host "compile failures: $($bad.Count)"
          cmd /c exit 0

      - name: Run confirmation tests
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($secret in @($env:MT5_LOGIN, $env:MT5_SERVER)) {
            if ($secret -and $secret -match '^[A-Za-z0-9._@\-]+$') { Write-Host "::add-mask::$secret" }
          }
          [System.Threading.Thread]::CurrentThread.CurrentCulture = [Globalization.CultureInfo]::InvariantCulture
          function Format-InputValue([object]$val) {
            if ($val -is [bool]) { return $val.ToString().ToLower() }
            if ($val -is [double] -or $val -is [decimal] -or $val -is [single]) {
              return ([double]$val).ToString([Globalization.CultureInfo]::InvariantCulture)
            }
            if ($val -is [int] -or $val -is [long]) { return "$val" }
            throw "input value type is not allowed"
          }
          $raw = python "$env:GITHUB_WORKSPACE\tools\robot_audit.py" --emit-batch "${{ matrix.batch }}"
          if ($LASTEXITCODE -ne 0) { throw "batch plan rejected" }
          $presets = @($raw | ConvertFrom-Json)
          $compileFailed = @()
          if (Test-Path "$env:RUNNER_TEMP\compile-failed.txt") {
            $compileFailed = @(Get-Content "$env:RUNNER_TEMP\compile-failed.txt" | Where-Object { $_ -match '^[a-z0-9-]+$' })
          }
          $reports = "$env:MT5_ROOT\reports"
          New-Item -ItemType Directory -Force $reports | Out-Null
          $dest = "$env:GITHUB_WORKSPACE\robot-audit-artifact"
          New-Item -ItemType Directory -Force $dest | Out-Null
          $failed = New-Object System.Collections.Generic.List[string]
          foreach ($preset in $presets) {
            $id = "$($preset.id)"
            if ($id -notmatch '^[a-z0-9-]+$') { throw "preset id is invalid" }
            if ($compileFailed -contains $id) { $failed.Add("$id|compile"); continue }
            if ("$($preset.from)" -ne "2026.01.01" -or "$($preset.to)" -ne "2026.10.15") { throw "date guard" }
            if ("$($preset.symbol)" -ne "XAUUSDm" -or [int]$preset.model -ne 4 -or [int]$preset.delay -ne 200) { throw "settings guard" }
            if ([int]$preset.deposit -ne 10000 -or "$($preset.currency)" -ne "USD" -or [int]$preset.leverage -ne 2000) { throw "money guard" }
            if ("$($preset.period)" -notmatch '^(M[0-9]+|H[0-9]+|D1|W1|MN1)$') { throw "period guard" }
            foreach ($setRoot in @("$env:MT5_ROOT\MQL5\Profiles\Tester", "$env:MT5_ROOT\Tester")) {
              if (Test-Path $setRoot) {
                Get-ChildItem $setRoot -Filter *.set -Recurse -ErrorAction SilentlyContinue |
                  ForEach-Object { Remove-Item $_.FullName -Force }
              }
            }
            $ini = "$env:RUNNER_TEMP\tester-$id.ini"
            $reason = ""
            try {
              @(
                "[Common]", "Login=$env:MT5_LOGIN", "Password=$env:MT5_PASSWORD", "Server=$env:MT5_SERVER",
                "ProxyEnable=0", "NewsEnable=0",
                "[Tester]",
                "Expert=experts\$($preset.expert -replace '/', '\').ex5",
                "Symbol=XAUUSDm",
                "Period=$($preset.period)",
                "Model=4",
                "ExecutionMode=200",
                "Optimization=0",
                "FromDate=2026.01.01",
                "ToDate=2026.10.15",
                "ForwardMode=0",
                "Deposit=10000",
                "Currency=USD",
                "Leverage=1:2000",
                "Visual=0",
                "Report=reports\$id",
                "ReplaceReport=1",
                "ShutdownTerminal=1"
              ) | Out-File $ini -Encoding Unicode
              $inputLines = @()
              if ($preset.inputs) {
                foreach ($prop in $preset.inputs.PSObject.Properties) {
                  $v = Format-InputValue $prop.Value
                  if ($prop.Name -notmatch '^[A-Za-z][A-Za-z0-9_]{0,40}$') { throw "input name is invalid" }
                  $inputLines += "$($prop.Name)=$v||$v||0||$v||N"
                }
              }
              if ($inputLines.Count -gt 0) {
                @("[TesterInputs]") + $inputLines | Out-File $ini -Encoding Unicode -Append
              }
              Write-Host "=== $id $($preset.expert) $($preset.period) 2026.01.01-2026.10.15 model 4 delay 200 deposit 10000 ==="
              $proc = Start-Process -FilePath "$env:MT5_ROOT\terminal64.exe" -ArgumentList "/portable", "/config:`"$ini`"" -PassThru
              $finished = $proc.WaitForExit(90 * 60 * 1000)
              if (-not $finished) {
                $reason = "timeout"
              } else {
                Start-Sleep -Seconds 3
                $htm = Join-Path $reports "$id.htm"
                if (-not (Test-Path $htm)) {
                  $reason = "no_report"
                } else {
                  $sanitizeArgs = @("$env:GITHUB_WORKSPACE\tools\robot_audit.py", "--sanitize", $htm, "--id", $id, "--out", $dest)
                  $xml = Join-Path $reports "$id.xml"
                  if (Test-Path $xml) { $sanitizeArgs += @("--xml", $xml) }
                  python @sanitizeArgs
                  if ($LASTEXITCODE -eq 3) { $reason = "holdout" }
                  elseif ($LASTEXITCODE -eq 4) { $reason = "no_history" }
                  elseif ($LASTEXITCODE -ne 0) { $reason = "sanitize" }
                }
              }
            } finally {
              if (Test-Path $ini) { Remove-Item $ini -Force }
              Get-Process terminal64, metatester64 -ErrorAction SilentlyContinue | Stop-Process -Force
              Start-Sleep -Seconds 5
            }
            if ($reason) { $failed.Add("$id|$reason") }
          }
          $failPath = Join-Path $dest "failures.json"
          $items = @()
          foreach ($row in $failed) {
            $parts = "$row".Split("|")
            if ($parts.Count -ne 2) { throw "failure record is invalid" }
            if ($parts[1] -notin @("compile", "no_report", "timeout", "holdout", "sanitize", "no_history")) { throw "failure reason is invalid" }
            $items += [ordered]@{ id = $parts[0]; reason = $parts[1] }
          }
          if ($items.Count -eq 0) {
            $json = "[]"
          } else {
            $json = ConvertTo-Json -InputObject @($items) -Depth 3
            if ($items.Count -eq 1) { $json = "[$json]" }
          }
          [System.IO.File]::WriteAllText($failPath, $json.Trim() + "`n")
          Write-Host "preset failures: $($failed.Count)"
          $global:LASTEXITCODE = 0
          cmd /c exit 0

      - name: Scan audit artifacts
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          foreach ($secret in @($env:MT5_LOGIN, $env:MT5_SERVER)) {
            if ($secret -and $secret -match '^[A-Za-z0-9._@\-]+$') { Write-Host "::add-mask::$secret" }
          }
          $dest = "$env:GITHUB_WORKSPACE\robot-audit-artifact"
          python "$env:GITHUB_WORKSPACE\tools\robot_audit.py" --scan-dir $dest
          if ($LASTEXITCODE -ne 0) {
            Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
            throw "audit artifacts failed the secret scan"
          }

      - name: Upload audit reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: robot-audit-batch-${{ matrix.batch }}
          path: robot-audit-artifact/
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: false

      - name: Require every preset
        if: success()
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE\tools\robot_audit.py" --require "$env:GITHUB_WORKSPACE\robot-audit-artifact\failures.json"
          if ($LASTEXITCODE -ne 0) { throw "one or more presets did not finish" }
